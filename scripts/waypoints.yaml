# 航线点配置，修改一份就够了，不用动 .py
# action 三选一：grab / place / pass
#   grab  : 到位 → 调用 vlm_detection(object) → 机械臂抓取 (/grab=True)
#   place : 到位 → 调用 vlm_detection(object) → 机械臂释放 (/grab=False)
#   pass  : 只路过，不做任何操作
# object : 喂给 vl_locate 的目标关键词，pass 时填什么都行（不生效）
# arm_pose: 可选，机械臂预设姿态，不填就用默认姿态

waypoints:
  - name: pickup_grape
    x: -0.137
    y:  2.485
    yaw: 0.0
    action: grab
    object: 葡萄

  - name: drop_center_1
    x:  0.297
    y:  1.215
    yaw: 0.0
    action: place
    object: 图片中心点

  - name: pickup_banana
    x:  1.442
    y:  2.207
    yaw: 0.0
    action: grab
    object: 香蕉

  - name: drop_center_2
    x:  2.0
    y:  1.5
    yaw: 0.0
    action: place
    object: 图片中心点

  - name: pickup_mangosteen
    x:  1.0
    y:  3.0
    yaw: 1.57
    action: grab
    object: 山竹

  - name: drop_center_3
    x:  0.0
    y:  2.0
    yaw: 3.14
    action: place
    object: 图片中心点
