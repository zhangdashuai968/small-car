# 航线点配置：供 scripts/move_base_waypoint_runner.py / auto_task_runner.py 读取；
# auto_navigation_grasp.py / ten_point_*.py 内联同坐标，改完这里还需同步改 .py
# action 四选一：pass / grab / place / finish
#   grab  : 到位 → 调用 vlm_detection(object) → 机械臂抓取 (/grab=True)
#   place : 到位 → 调用 vlm_detection(object) → 机械臂释放 (/grab=False)
#   pass  : 只路过，不做任何操作
#   finish: 终点收尾，停止抓取并让舵机回 home
# object : 喂给 vl_locate 的目标关键词，pass 时填什么都行（不生效）
# arm_pose: 可选，机械臂预设姿态，不填就用默认姿态

waypoints:
