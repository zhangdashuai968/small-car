DWAPlannerROS:
  holonomic_robot: true
  
  max_vel_x: 0.25
  min_vel_x: -0.13
  max_vel_y: 0.25
  min_vel_y: -0.25
  max_vel_trans: 0.25
  min_vel_trans: 0.05

  max_vel_theta: 0.2
  min_vel_theta: 0.0
  acc_lim_theta: 1.0

  xy_goal_tolerance: 0.25
  yaw_goal_tolerance: 6.28
  latch_xy_goal_tolerance: false

  vx_samples: 30
  vy_samples: 30
  vth_samples: 3
  sim_time: 2.0
  controller_frequency: 10.0

  weight_max_vel_x: 60.0
  weight_max_vel_y: 60.0
  weight_max_vel_theta: 80.0
  weight_kinematics_nh: 0.1
  weight_obstacle: 250.0
  weight_path: 15.0
  weight_goal: 80.0
