DWAPlannerROS:
  holonomic_robot: true
  
  max_vel_x: 0.25
  min_vel_x: -0.13
  max_vel_y: 0.25
  min_vel_y: -0.25
  max_vel_trans: 0.25
  min_vel_trans: 0.05

  max_vel_theta: 0.2
  min_vel_theta: 0.0
  acc_lim_theta: 1.0

  xy_goal_tolerance: 0.25
  yaw_goal_tolerance: 6.28
  latch_xy_goal_tolerance: false

  vx_samples: 30
  vy_samples: 30
  vth_samples: 3
  sim_time: 1.2
  controller_frequency: 10.0
  prune_plan: true

  path_distance_bias: 32.0
  goal_distance_bias: 12.0
  occdist_scale: 0.08
  twirling_scale: 8.0
