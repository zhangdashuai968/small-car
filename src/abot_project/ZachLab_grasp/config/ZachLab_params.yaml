# 机械臂基础抓取参数配置文件

# 机械臂初始位置参数
x: 0
y: 0
z: 250
rotary: 90

# 控制参数
speed: 1500  # 舵机控制速度 ms
port: "/dev/ttyACM0"
baud: 115200

# 夹爪位置参数
gripper_close: 700
gripper_open: 150
gripper_default: 500

# 标定参数
cali_1_im: [38, 366]
cali_1_mc: [-70, 105]
cali_2_im: [577, 92]
cali_2_mc: [130, 195]
cali_3_im: [63, 193]
cali_3_mc: [-75, 190]
cali_4_im: [590, 373]
cali_4_mc: [120, 95]
cali_rotary_anchors: [[38, 120], [63, 110], [331, 75], [577, 55], [590, 40]]

# 抓取参数
grasp_z: -95             # -95平面微调终版(11-03)
grasp_offset_x: 10      # 
grasp_offset_y: 0      # X轴偏移
rotation_factor: 0.0             # 11-02:自动转盘旋转关闭,标定系=rotary90,旋转会引入偏移
max_rotation_angle: 45  # 最大旋转角度

# 模式参数
continuous_mode: true   # True为持续抓取，False为单次抓取

# 话题名称
pose_topic: "/Pose"
cali_5_im: [331, 218]
cali_5_mc: [35, 150]
home_x: 25
home_y: 0
home_z: 240
